name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use current npm client
        run: npm install --global npm@11 --no-audit --no-fund
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib

  codespace-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
      - name: Validate Codespaces AI helpers
        run: |
          bash -n scripts/setup-codespace-ai.sh
          bash -n scripts/check-codespace-ai.sh
          python3 scripts/validate-ai-model-manifest.py
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib


  stirling-core-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build pinned Temurin runtime for fully offline PDF processing
        shell: pwsh
        run: |
          ./scripts/build-temurin-runtime-windows.ps1
          $manifest = Get-Content 'runtime/java/malenjo-runtime-manifest.json' -Raw | ConvertFrom-Json
          if ($manifest.version -ne '25.0.4.1+1' -or
              $manifest.archiveSha256 -ne '00c847d804f4a78e9f04f2683faf14fed898535b177b7fc704486cb0284e9283') {
            throw 'The Java runtime does not match the reviewed pinned Windows release.'
          }
          if (!(Test-Path 'runtime/java/legal/java.base/LICENSE') -or
              !(Test-Path 'runtime/java/bin/java.exe')) {
            throw 'The bundled runtime or its required GPL/ClassPath license text is missing.'
          }
      - name: Build approved qpdf Windows provider pack
        shell: pwsh
        run: |
          ./scripts/build-qpdf-windows.ps1
          $manifest = Get-Content "provider-packs/qpdf/manifest.json" -Raw | ConvertFrom-Json
          if ($manifest.version -ne "12.4.2") { throw "Unexpected qpdf version." }
          if ($manifest.sha256 -ne "db87077e683630c1217e0e8f9a20a9749d952ab676e881c3689187763a5de25d") {
            throw "Unexpected qpdf source checksum."
          }
          if ($manifest.redistribution -ne "integration-approved-release-gated") {
            throw "Unexpected qpdf redistribution state."
          }
          if (@($manifest.runtimeFiles).Count -lt 2) {
            throw "qpdf runtime file inventory is missing or unexpectedly empty."
          }
          $sbom = Get-Content "provider-packs/qpdf/sbom.cdx.json" -Raw | ConvertFrom-Json
          if ($sbom.bomFormat -ne "CycloneDX" -or $sbom.specVersion -ne "1.5" -or @($sbom.components).Count -ne 4) {
            throw "qpdf component SBOM failed structural validation."
          }
          foreach ($notice in @(
            "qpdf-LICENSE.txt", "qpdf-NOTICE.md", "libjpeg-turbo-LICENSE.md",
            "libjpeg-turbo-README.ijg", "openssl-LICENSE.txt", "zlib-LICENSE.txt"
          )) {
            if (!(Test-Path (Join-Path "provider-packs/qpdf/runtime/malenjo-notices" $notice))) {
              throw "Required qpdf pack notice missing: $notice"
            }
          }
          $qpdf = Get-ChildItem "provider-packs/qpdf/runtime" -Recurse -File -Filter "qpdf.exe" | Select-Object -First 1
          if (-not $qpdf) { throw "qpdf provider pack did not contain qpdf.exe." }
          $version = (& $qpdf.FullName --version 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or $version -notmatch "12\.4\.2") {
            throw "qpdf provider pack failed its executable smoke check."
          }
      - name: Build reviewed Tesseract Windows provider pack
        shell: pwsh
        run: |
          ./scripts/build-tesseract-windows.ps1
          $manifest = Get-Content "provider-packs/tesseract/manifest.json" -Raw | ConvertFrom-Json
          if ($manifest.version -ne "5.5.3") { throw "Unexpected Tesseract version." }
          if ($manifest.sha256 -ne "bee9e3434bd94fd65387d9be28cd467a41f61b1275383b55b0f59a1331270ae4") {
            throw "Unexpected Tesseract installer checksum."
          }
          if ($manifest.releaseCommit -ne "db0ec62f81b0737fbbe184d8fea40af5738f8eef") {
            throw "Unexpected Tesseract source commit."
          }
          if ($manifest.redistribution -ne "integration-approved-release-gated") {
            throw "Unexpected Tesseract redistribution state."
          }
          if (@($manifest.runtimeFiles).Count -lt 5) {
            throw "Tesseract runtime file inventory is missing or unexpectedly small."
          }
          $models = @($manifest.models)
          if ($models.Count -ne 2) { throw "Expected exactly eng + osd reviewed model entries." }
          if (($models | Where-Object { $_.id -eq "eng" }).gitBlobSha1 -ne "bbef4675053b5b468cdb477053e28b1c698ba08e") {
            throw "Unexpected eng.traineddata Git blob."
          }
          if (($models | Where-Object { $_.id -eq "osd" }).gitBlobSha1 -ne "527457ca8f8fe1fda7c2f88bce3c0e4be12be9d0") {
            throw "Unexpected osd.traineddata Git blob."
          }
          $sbom = Get-Content "provider-packs/tesseract/sbom.cdx.json" -Raw | ConvertFrom-Json
          if ($sbom.bomFormat -ne "CycloneDX" -or $sbom.specVersion -ne "1.5" -or @($sbom.components).Count -ne 3) {
            throw "Tesseract component SBOM failed structural validation."
          }
          foreach ($notice in @("tesseract-LICENSE.txt", "tessdata-LICENSE.txt", "DEPENDENCIES.md")) {
            if (!(Test-Path (Join-Path "provider-packs/tesseract/runtime/malenjo-notices" $notice))) {
              throw "Required Tesseract pack notice missing: $notice"
            }
          }
          $tesseract = Get-ChildItem "provider-packs/tesseract/runtime/bin" -Recurse -File -Filter "tesseract.exe" | Select-Object -First 1
          if (-not $tesseract) { throw "Tesseract provider pack did not contain tesseract.exe." }
          $env:TESSDATA_PREFIX = (Resolve-Path "provider-packs/tesseract/runtime/tessdata").Path
          $version = (& $tesseract.FullName --version 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or $version -notmatch "tesseract\s+v?5\.5\.3(?:\.\d+)?") {
            throw "Tesseract provider pack failed its executable smoke check."
          }
          $languages = (& $tesseract.FullName --list-langs 2>&1 | Out-String)
          if ($languages -notmatch "(?m)^eng\s*$" -or $languages -notmatch "(?m)^osd\s*$") {
            throw "Tesseract pack is missing reviewed eng/osd model data."
          }
      - name: Inventory WeasyPrint Windows provider candidate
        shell: pwsh
        run: |
          ./scripts/build-weasyprint-windows.ps1
          $manifest = Get-Content "provider-packs/weasyprint/manifest.json" -Raw | ConvertFrom-Json
          $inventory = Get-Content "provider-packs/weasyprint/inventory.json" -Raw | ConvertFrom-Json
          if ($manifest.version -ne "70.0") { throw "Unexpected WeasyPrint version." }
          if ($manifest.releaseCommit -ne "4d3b7b6449e3494f59c7c2f36b512d129225679c") {
            throw "Unexpected WeasyPrint source commit."
          }
          if ($manifest.sha256 -ne "ab1151f210b4e6bb7aa7a79e91a67e8ddb760094c107bfda55241b6aaefe7d53") {
            throw "Unexpected WeasyPrint release asset checksum."
          }
          if ($manifest.redistribution -ne "inventory-only-not-approved" -or $manifest.capabilityEnabled -ne $false) {
            throw "WeasyPrint must remain inventory-only until the complete Windows transitive license closure is reviewed."
          }
          if (@($inventory.runtimeFiles).Count -lt 10 -or @($inventory.nativeFiles).Count -lt 2) {
            throw "WeasyPrint runtime/native inventory is missing or unexpectedly small."
          }
          if ($null -eq $inventory.pythonPackages) {
            throw "WeasyPrint inventory schema is missing the bundled Python package metadata field."
          }
          if (!(Test-Path "provider-packs/weasyprint/runtime/malenjo-notices/weasyprint-LICENSE.txt")) {
            throw "WeasyPrint BSD license notice is missing from the audit pack."
          }
          $weasy = Resolve-Path "provider-packs/weasyprint/runtime/bin/weasyprint.exe"
          $info = (& $weasy --info 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or $info -notmatch "70\.0") {
            throw "WeasyPrint candidate failed its executable identity check."
          }
          Write-Host "WeasyPrint native inventory for legal mapping:"
          @($inventory.nativeFiles) | ForEach-Object {
            Write-Host ("WEASY_NATIVE|{0}|{1}|{2}|{3}|{4}|{5}|{6}" -f $_.path,$_.size,$_.sha256,$_.fileVersion,$_.productVersion,$_.productName,$_.companyName)
          }
          Write-Host "WeasyPrint bundled Python package metadata:"
          @($inventory.pythonPackages) | ForEach-Object {
            Write-Host ("WEASY_PYTHON|{0}|{1}|{2}|{3}" -f $_.name,$_.version,$_.licenseExpression,$_.license)
          }
      - name: Build reviewed Stirling open-core provider pack
        shell: pwsh
        run: |
          ./scripts/build-stirling-core.ps1
          if (!(Test-Path "provider-packs/stirling-core/stirling-pdf.jar")) {
            throw "Stirling core pack JAR was not produced."
          }
          $manifest = Get-Content "provider-packs/stirling-core/manifest.json" -Raw | ConvertFrom-Json
          if ($manifest.upstreamCommit -ne "25220cbdbde2d526cebf173b94357884e180b8c1") {
            throw "Unexpected Stirling core source pin."
          }
          if ($manifest.restrictedSourceMaterialized -ne $false) {
            throw "Restricted Stirling source must never be materialized."
          }
          $expectedPatches = @(
            "third_party/stirling-pdf/patches/0001-malenjo-java-effect-alternatives.patch",
            "third_party/stirling-pdf/patches/0002-malenjo-core-license-overrides.patch"
          )
          $manifestPatches = @($manifest.patches)
          if ($manifestPatches.Count -ne $expectedPatches.Count) {
            throw "Unexpected Stirling open-core patch count."
          }
          foreach ($patchPath in $expectedPatches) {
            $patch = $manifestPatches | Where-Object { $_.path -eq $patchPath } | Select-Object -First 1
            $patchHash = (Get-FileHash -Algorithm SHA256 $patchPath).Hash.ToLowerInvariant()
            if (-not $patch -or $patch.sha256 -ne $patchHash) {
              throw "Stirling open-core patch provenance mismatch: $patchPath"
            }
          }
          $actualStirlingHash = (Get-FileHash -Algorithm SHA256 "provider-packs/stirling-core/stirling-pdf.jar").Hash.ToLowerInvariant()
          if ($manifest.sha256 -ne $actualStirlingHash) {
            throw "Generated Stirling JAR hash does not match its provider manifest."
          }

          $office = $manifest.embeddedOfficeConvert
          if ($office.version -ne "0.2.2" -or $office.sourceCommit -ne "673aab8d6ac784524cd1d90141c95e74b9fd26ae" -or $office.license -ne "MIT") {
            throw "Unexpected embedded Stirling Office Convert provenance."
          }
          if ($office.verification -ne "pinned-published-sha256") {
            throw "Embedded Office artifacts were not verified against repository-pinned published SHA-256 identities."
          }
          $officeJars = @($office.jars.PSObject.Properties)
          $artifactPins = @{}
          foreach ($line in Get-Content "third_party/stirling-office-convert/ARTIFACTS.sha256") {
            if ($line -match "^([0-9a-f]{64})\s+(.+)$") {
              $artifactPins[$Matches[2].Trim()] = $Matches[1]
            }
          }
          $expectedOfficeJars = @(
            "stirling-office-convert-0.2.2.jar",
            "stirling-office-convert-legacy-0.2.2.jar",
            "stirling-office-convert-topdf-0.2.2.jar"
          )
          if ($officeJars.Count -ne $expectedOfficeJars.Count) { throw "Expected exactly three embedded Office Convert JARs." }
          foreach ($expectedOfficeJar in $expectedOfficeJars) {
            $jarEntry = $officeJars | Where-Object { $_.Name -eq $expectedOfficeJar } | Select-Object -First 1
            if (-not $jarEntry -or -not $artifactPins[$expectedOfficeJar] -or $jarEntry.Value -ne $artifactPins[$expectedOfficeJar]) {
              throw "Embedded Office Convert JAR does not match reviewed published SHA-256 pin: $expectedOfficeJar"
            }
          }
          foreach ($notice in @(
            "stirling-pdf-LICENSE.txt",
            "stirling-office-convert-LICENSE.txt",
            "stirling-office-convert-DEPENDENCIES.md",
            "stirling-dependency-licenses.json"
          )) {
            if (!(Test-Path (Join-Path "provider-packs/stirling-core/malenjo-notices" $notice))) {
              throw "Required Stirling core notice/report missing: $notice"
            }
          }
          $expectedLicenseArtifacts = @(
            "malenjo-notices/stirling-office-convert-LICENSE.txt",
            "malenjo-notices/stirling-office-convert-DEPENDENCIES.md",
            "malenjo-notices/stirling-dependency-licenses.json"
          )
          foreach ($relative in $expectedLicenseArtifacts) {
            $property = $manifest.licenseArtifacts.PSObject.Properties | Where-Object { $_.Name -eq $relative } | Select-Object -First 1
            $actualHash = (Get-FileHash -Algorithm SHA256 (Join-Path "provider-packs/stirling-core" $relative)).Hash.ToLowerInvariant()
            if (-not $property -or $property.Value -ne $actualHash) {
              throw "Stirling Office license artifact hash mismatch: $relative"
            }
          }
          if ((Get-FileHash -Algorithm SHA256 "provider-packs/stirling-core/malenjo-notices/stirling-office-convert-LICENSE.txt").Hash -ne (Get-FileHash -Algorithm SHA256 "third_party/stirling-office-convert/LICENSE.txt").Hash) {
            throw "Office Convert MIT license notice differs from the reviewed checked-in baseline."
          }
          if ((Get-FileHash -Algorithm SHA256 "provider-packs/stirling-core/malenjo-notices/stirling-office-convert-DEPENDENCIES.md").Hash -ne (Get-FileHash -Algorithm SHA256 "third_party/stirling-office-convert/DEPENDENCIES.md").Hash) {
            throw "Office Convert dependency review differs from the reviewed checked-in baseline."
          }
          $licenseText = Get-Content "provider-packs/stirling-core/malenjo-notices/stirling-dependency-licenses.json" -Raw
          if ($licenseText.Length -lt 1000 -or $licenseText -notmatch "stirling-office-convert") {
            throw "Generated Stirling dependency-license report does not contain the embedded Office converter."
          }
          $null = $licenseText | ConvertFrom-Json
      - name: Smoke-test local Windows PDF provider
        shell: pwsh
        run: |
          # Exercise the exact Java executable packaged into MALENJO, not
          # the CI host's preinstalled Temurin. This is the offline delivery gate.
          $java = (Resolve-Path "runtime/java/bin/java.exe").Path
          $curl = (Get-Command curl.exe).Source
          $jar = Resolve-Path "provider-packs/stirling-core/stirling-pdf.jar"
          $qpdf = Get-ChildItem "provider-packs/qpdf/runtime" -Recurse -File -Filter "qpdf.exe" | Select-Object -First 1
          if (-not $qpdf) { throw "qpdf runtime executable was not found." }
          $tesseract = Get-ChildItem "provider-packs/tesseract/runtime/bin" -Recurse -File -Filter "tesseract.exe" | Select-Object -First 1
          if (-not $tesseract) { throw "Tesseract runtime executable was not found." }
          $tessdata = (Resolve-Path "provider-packs/tesseract/runtime/tessdata").Path
          $env:PATH = "$($qpdf.Directory.FullName);$($tesseract.Directory.FullName)"
          $env:TESSDATA_PREFIX = $tessdata
          $env:STIRLING_FLAVOR = "core"
          $env:DISABLE_ADDITIONAL_FEATURES = "true"
          $env:ENABLE_SAAS = "false"
          $providerContext = "/malenjo-ci"
          $providerBase = "http://127.0.0.1:28970$providerContext"
          $process = Start-Process -FilePath $java -ArgumentList @(
            "-Xms128m",
            "-Xmx1536m",
            "-jar", $jar,
            "--server.address=127.0.0.1",
            "--server.port=28970",
            "--server.servlet.context-path=$providerContext",
            "--spring.main.banner-mode=off",
            "--system.stirlingOfficeConversion=true"
          ) -PassThru -NoNewWindow
          try {
            $healthy = $false
            for ($i = 0; $i -lt 180; $i++) {
              try {
                $health = Invoke-RestMethod -Uri "$providerBase/api/v1/info/health" -TimeoutSec 2
                if ($health.status -eq "UP") { $healthy = $true; break }
              } catch {}
              Start-Sleep -Milliseconds 500
              if ($process.HasExited) { throw "Stirling core exited before health check passed." }
            }
            if (!$healthy) { throw "Stirling core did not become healthy." }

            $api = Invoke-RestMethod -Uri "$providerBase/v1/api-docs" -TimeoutSec 20
            $v1Paths = @($api.paths.PSObject.Properties | Where-Object { $_.Name.StartsWith("/api/v1/") })
            if ($v1Paths.Count -lt 25) {
              throw "Expected a broad Stirling core OpenAPI surface, found only $($v1Paths.Count) /api/v1 paths."
            }
            Write-Host "Stirling core healthy with $($v1Paths.Count) /api/v1 paths."

            foreach ($requiredPath in @(
              "/api/v1/misc/repair",
              "/api/v1/misc/compress-pdf",
              "/api/v1/misc/ocr-pdf",
              "/api/v1/misc/auto-rotate-pdf",
              "/api/v1/misc/scanner-effect",
              "/api/v1/misc/replace-invert-pdf",
              "/api/v1/convert/file/pdf",
              "/api/v1/convert/pdf/word",
              "/api/v1/convert/pdf/presentation",
              "/api/v1/convert/pdf/text",
              "/api/v1/convert/pdf/xlsx"
            )) {
              if (!$api.paths.PSObject.Properties.Name.Contains($requiredPath)) {
                throw "Expected reviewed local operation $requiredPath to be present."
              }
            }

            New-Item -ItemType Directory -Force -Path ".build/provider-smoke" | Out-Null
            $fixture = Join-Path (Resolve-Path ".build/provider-smoke") "valid-one-page.pdf"
            ./scripts/write-valid-pdf-smoke-fixture.ps1 -OutputPath $fixture
            & $qpdf.FullName --check $fixture
            if ($LASTEXITCODE -ne 0) { throw "Generated PDF smoke fixture failed qpdf validation." }

            # Positive end-to-end test of pinned Stirling's actual controller:
            # send a real PDF, validate the rewritten bytes, and inspect the
            # persisted metadata through a second independent parser (qpdf).
            $metadataOut = Join-Path (Resolve-Path ".build/provider-smoke") "updated-metadata.pdf"
            & $curl --fail --silent --show-error -o $metadataOut `
              -F "fileInput=@$fixture;type=application/pdf" `
              -F "title=MALENJO Offline Metadata Smoke" `
              -F "author=MALENJO Runtime" `
              -F "subject=Local PDF engine verification" `
              -F "keywords=offline, metadata" `
              "$providerBase/api/v1/misc/update-metadata"
            if ($LASTEXITCODE -ne 0) { throw "Stirling update-metadata endpoint failed to process a real PDF." }
            & $qpdf.FullName --check $metadataOut
            if ($LASTEXITCODE -ne 0) { throw "Stirling updated-metadata output cannot be reopened by qpdf." }
            $pages = (& $qpdf.FullName --show-npages $metadataOut | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or $pages -ne '1') {
              throw "Stirling update-metadata changed or damaged the original page count."
            }
            $metaJson = (& $qpdf.FullName --json=1 --json-key=objects $metadataOut | Out-String)
            if ($LASTEXITCODE -ne 0 -or
                $metaJson -notmatch 'MALENJO Offline Metadata Smoke' -or
                $metaJson -notmatch 'MALENJO Runtime') {
              throw "Stirling update-metadata output does not persist the expected document metadata."
            }

            # Real merge/split round-trip using the pinned Windows Stirling core.
            # These checks validate PDF page counts and actual ZIP members,
            # not just HTTP status codes or a response content type.
            $mergeOut = Join-Path (Resolve-Path ".build/provider-smoke") "merged-two-pages.pdf"
            & $curl --fail --silent --show-error -o $mergeOut `
              -F "fileInput=@$fixture;filename=first.pdf;type=application/pdf" `
              -F "fileInput=@$fixture;filename=second.pdf;type=application/pdf" `
              "$providerBase/api/v1/general/merge-pdfs"
            if ($LASTEXITCODE -ne 0) { throw "Stirling merge-pdfs failed on two real documents." }
            & $qpdf.FullName --check $mergeOut
            if ($LASTEXITCODE -ne 0) { throw "Stirling merge-pdfs produced an invalid PDF." }
            $mergedPageCount = (& $qpdf.FullName --show-npages $mergeOut | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or $mergedPageCount -ne '2') {
              throw "Stirling merge-pdfs output has $mergedPageCount pages; expected 2."
            }

            $splitZip = Join-Path (Resolve-Path ".build/provider-smoke") "split-two-pages.zip"
            & $curl --fail --silent --show-error -o $splitZip `
              -F "fileInput=@$mergeOut;type=application/pdf" `
              -F "pageNumbers=all" `
              "$providerBase/api/v1/general/split-pages"
            if ($LASTEXITCODE -ne 0) { throw "Stirling split-pages failed on a merged PDF." }

            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $splitDir = Join-Path (Resolve-Path ".build/provider-smoke") "split-pages"
            New-Item -ItemType Directory -Force -Path $splitDir | Out-Null
            $splitArchive = [System.IO.Compression.ZipFile]::OpenRead($splitZip)
            try {
              $pdfEntries = @($splitArchive.Entries | Where-Object { $_.FullName -match '\\.pdf
              $zip = [System.IO.Compression.ZipFile]::OpenRead($Path)
              try {
                if (-not ($zip.Entries | Where-Object { $_.FullName -eq $Entry })) {
                  throw "Expected ZIP entry '$Entry' missing from $Path"
                }
              } finally {
                $zip.Dispose()
              }
            }

            function Read-ZipEntryText([string]$Path, [string]$Entry) {
              $zip = [System.IO.Compression.ZipFile]::OpenRead($Path)
              try {
                $item = $zip.Entries | Where-Object { $_.FullName -eq $Entry } | Select-Object -First 1
                if (-not $item) { return "" }
                $reader = New-Object System.IO.StreamReader($item.Open())
                try { return $reader.ReadToEnd() } finally { $reader.Dispose() }
              } finally {
                $zip.Dispose()
              }
            }

            $officeText = Join-Path (Resolve-Path ".build/provider-smoke") "office-input.txt"
            Set-Content -Path $officeText -Value "MALENJO embedded Office Convert smoke test" -Encoding utf8
            $officePdfOut = Join-Path (Resolve-Path ".build/provider-smoke") "office-to-pdf.pdf"
            & $curl --fail --silent --show-error -o $officePdfOut -F "fileInput=@$officeText;type=text/plain" "$providerBase/api/v1/convert/file/pdf"
            if ($LASTEXITCODE -ne 0) { throw "Embedded Office text-to-PDF operation smoke failed." }

            $docxOut = Join-Path (Resolve-Path ".build/provider-smoke") "pdf-to-word.docx"
            & $curl --fail --silent --show-error -o $docxOut -F "fileInput=@$fixture;type=application/pdf" -F "outputFormat=docx" "$providerBase/api/v1/convert/pdf/word"
            if ($LASTEXITCODE -ne 0) { throw "Embedded Office PDF-to-DOCX operation smoke failed." }
            Assert-ZipEntry $docxOut "word/document.xml"

            $pptxOut = Join-Path (Resolve-Path ".build/provider-smoke") "pdf-to-presentation.pptx"
            & $curl --fail --silent --show-error -o $pptxOut -F "fileInput=@$fixture;type=application/pdf" -F "outputFormat=pptx" "$providerBase/api/v1/convert/pdf/presentation"
            if ($LASTEXITCODE -ne 0) { throw "Embedded Office PDF-to-PPTX operation smoke failed." }
            Assert-ZipEntry $pptxOut "ppt/presentation.xml"

            $rtfOut = Join-Path (Resolve-Path ".build/provider-smoke") "pdf-to-text.rtf"
