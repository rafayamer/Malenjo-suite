name: PDF browser acceptance

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pdf-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pdf-ui-browser-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Use npm 11
        run: npm install --global npm@11 --no-audit --no-fund
      - name: Install frontend and uncommitted test-only Playwright
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright
      - name: Install Chromium for real browser interaction
        run: npx playwright install --with-deps chromium
      - name: Launch all 22 workspaces and verify real PDF workflows in Chromium
        run: node scripts/pdf-ui-browser-smoke.mjs
      - name: Verify command palette Enter and keyboard focus in real Chromium
        run: node scripts/command-palette-enter-focus-browser-smoke.mjs
      - name: Verify shell menus and drawers are keyboard operable in real Chromium
        run: node scripts/phase1-shell-keyboard-browser-smoke.mjs
      - name: Verify session restore and recovery in real Chromium
        run: node scripts/phase1-session-restore-browser-smoke.mjs
      - name: Phase 2 PDF core and editor acceptance with independent output reopen
        run: node scripts/pdf-phase2-browser-acceptance.mjs
      - name: Phase 2 organize acceptance (merge and split) with independent output reopen
        run: node scripts/pdf-phase2-organize-acceptance.mjs
      - name: Phase 2 layout acceptance (N-up and batch) with independent output reopen
        run: node scripts/pdf-phase2-layout-acceptance.mjs
      - name: Phase 2 stamping acceptance (headers, numbers, watermarks) with independent output reopen
        run: node scripts/pdf-phase2-stamp-acceptance.mjs
      - name: Phase 2 properties and navigation acceptance (metadata, bookmarks, links, contents) with independent output reopen
        run: node scripts/pdf-phase2-navigation-acceptance.mjs
      - name: Phase 2 optimize acceptance (lossless and image compression) with independent output reopen
        run: node scripts/pdf-phase2-optimize-acceptance.mjs
      - name: Phase 2 markup acceptance (text markup, drawings, notes) with independent output reopen
        run: node scripts/pdf-phase2-markup-acceptance.mjs
      - name: Phase 2 text editing acceptance (native text edit, find and replace, revisions) with independent output reopen
        run: node scripts/pdf-phase2-textedit-acceptance.mjs
      - name: Publish Phase 3 light/dark visual review screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-malenjo-dark-light-visual-review
          path: .build/pdf-ui-browser/theme-review/*.png
          retention-days: 14
          if-no-files-found: error
      - name: Upload screenshot when PDF UI acceptance fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-ui-browser-failure
          path: |
            .build/pdf-ui-browser/failure.png
            .build/pdf-phase2-browser/*.png
            .build/phase2-*-browser/*.png
          retention-days: 7
          if-no-files-found: warn
      - name: Report completed browser-acceptance result
        if: always()
        run: echo 'Browser PDF acceptance requires a real Chromium pass; green frontend unit tests are not sufficient.'

  # Phase 1 visual gate: every screen, both themes, the six required sizes.
  # Fails on page overflow, clipped bar controls, text below WCAG AA contrast
  # against its rendered background, or browser errors. The screenshots and
  # contact sheets are uploaded for human review either way.
  phase1-visual-matrix-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Use npm 11
        run: npm install --global npm@11 --no-audit --no-fund
      - name: Install frontend and uncommitted test-only Playwright
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Phase 1 visual matrix (layout and WCAG AA text contrast)
        run: node scripts/phase1-visual-matrix.mjs
      - name: Publish Phase 1 visual matrix for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-visual-matrix
          path: |
            .build/phase1-visual-matrix/**/*.png
            .build/phase1-visual-matrix/summary.json
          retention-days: 14
          if-no-files-found: warn

  # Same Phase 2 acceptance on a real Windows runner. MALENJO's desktop shell
  # uses WebView2 (Chromium), so this is Windows rendering/font/file-dialog-
  # free evidence. It does not replace a clean-installed desktop check or a
  # physical-printer check (see docs/PDF_PHASE2.md).
  pdf-phase2-browser-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Use npm 11
        run: npm install --global npm@11 --no-audit --no-fund
      - name: Install frontend and uncommitted test-only Playwright
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Phase 2 PDF core and editor acceptance on Windows
        run: node scripts/pdf-phase2-browser-acceptance.mjs
      - name: Upload Windows failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-phase2-browser-windows-failure
          path: .build/pdf-phase2-browser/*.png
          retention-days: 7
          if-no-files-found: warn
