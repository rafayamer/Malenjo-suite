[package]
name = "malenjo-suite"
version = "0.1.0"
description = "MALENJO Suite local-first desktop shell"
authors = ["MALENJO student project"]
edition = "2021"

[lib]
name = "malenjo_suite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
