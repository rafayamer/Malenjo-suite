[package]
name = "malenjo-suite"
version = "0.1.0"
description = "MALENJO Suite local-first desktop shell"
authors = ["MALENJO student project"]
edition = "2021"

[lib]
name = "malenjo_suite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.13.5", features = ["json", "multipart", "query"] }
tokio = { version = "1", features = ["macros", "sync", "time"] }
zeroize = "1.8"
sha2 = "0.10"
